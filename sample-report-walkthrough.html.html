 CAPS.forEach((n,c)=>{const g=capG[c];h+='<tr data-hl="a3-'+c+'"><td><b>'+n+'</b></td><td class="n">'+f1(g.s)+'</td><td class="n">'+f1(g.L)+'</td><td class="n">'+f1(g.T)+'</td><td class="n">'+f1(g.S)+'</td><td class="n"><b>'+f1(g.fp)+'</b></td>'+bmC(g.fp,g.bm)+'</tr>'});
 return h+'</tbody></table></div>';
}
function zones(){
 const L={R:[],U:[],O:[],G:[]}; U.forEach(r=>L[zone(r)].push(r));
 L.R.sort((a,b)=>fp(b)-fp(a)||a.id-b.id); ["U","O","G"].forEach(k=>L[k].sort((a,b)=>fp(b)-fp(a)||a.id-b.id));
 let h='<h2 class="sec">Section 2 &mdash; Awareness Zones</h2><p class="hint">Items are placed into one of four zones based on the relationship between My Own View and The Full Picture. A difference of 1.25 or more on the 1&ndash;7 scale triggers zone placement.</p>';
 ["R","U","O","G"].forEach(k=>{
  const a=L[k]; const lim=(k==="R"?5:a.length);
  h+='<div class="zone z-'+k+'" data-hl="z-'+k+'"><div class="zh">'+ZH[k]+' ('+a.length+')</div>';
  if(!a.length) h+='<div class="zn">No behaviors in this zone for this assessment.</div>';
  a.forEach((r,i)=>{const d=Math.round((r.s-fp(r))*100)/100;
   const dt=d===0?"views match":("self "+Math.abs(d).toFixed(1)+(d>0?" higher":" lower"));
   h+='<div class="zi'+(i>=lim?' hid':'')+'" '+(i>=lim?'style="display:none"':'')+'>'+esc(r.t)+'<small>The Full Picture: '+f1(fp(r))+' &middot; My Own View: '+r.s+' &middot; '+dt+'</small></div>';});
  if(k==="R"&&a.length>5) h+='<button class="more" type="button" id="moreR">Show all '+a.length+'</button>';
  h+='</div>';});
 return h;
}
function clusterSummary(){
 let h='<h2 class="sec">Section 3 &mdash; Capacity &amp; Cluster Summary</h2><p class="hint">The Full Picture score is shown for each capacity and its behavioral clusters.</p>';
 CAPS.forEach((n,c)=>{
  h+='<div class="cap"><h3>'+n+'</h3><p class="capd">'+CAPD[c]+'</p><div class="ov"><table><thead><tr><th>Cluster</th><th class="n">The Full Picture</th>'+bmH()+'<th class="n">My Leader\'s View</th><th class="n">My Team\'s View</th><th class="n">My Stakeholders\' View</th><th class="n">My Own View</th></tr></thead><tbody>';
  const g=capG[c];
  h+='<tr class="tot" data-hl="c1-'+c+'"><td>Overall</td><td class="n">'+f1(g.fp)+'</td>'+bmC(g.fp,g.bm)+'<td class="n">'+f1(g.L)+'</td><td class="n">'+f1(g.T)+'</td><td class="n">'+f1(g.S)+'</td><td class="n">'+f1(g.s)+'</td></tr>';
  clusters.filter(k=>k.c===c).forEach(k=>{const q=k.g;
   h+='<tr data-hl="c2-'+c+'-'+k.cl.replace(/\W/g,"")+'"><td>'+esc(k.cl)+'</td><td class="n">'+f1(q.fp)+'</td>'+bmC(q.fp,q.bm)+'<td class="n">'+f1(q.L)+'</td><td class="n">'+f1(q.T)+'</td><td class="n">'+f1(q.S)+'</td><td class="n">'+f1(q.s)+'</td></tr>';});
  h+='</tbody></table></div></div>';});
 return h;
}
function tag(r){return ZN[zone(r)]+" &middot; ["+CAPS[r.c]+" &middot; "+esc(r.cl)+"]"}
function spotlight(){
 const s=U.slice().sort((a,b)=>fp(b)-fp(a)||a.id-b.id), hi=s.slice(0,5), lo=s.slice(-5).reverse();
 const row=r=>'<div class="sp" data-hl="sp-'+r.id+'"><div>'+esc(r.t)+'<small>'+tag(r)+'</small></div><div style="text-align:right"><b>'+f1(fp(r))+'</b>'+(BM?'<small>Benchmark '+f1(r.bm)+' &nbsp;'+IND[ind(fpRaw(r),r.bm)]+'</small>':'')+'</div></div>';
 return '<h2 class="sec">Section 4 &mdash; Spotlight Items</h2><p class="hint">The five highest-rated and five lowest-rated behaviors based on The Full Picture.</p><h3>Highest Rated &mdash; Your Most Visible Strengths</h3><div data-hl="d1">'+hi.map(row).join("")+'</div><h3>Lowest Rated &mdash; Your Clearest Development Opportunities</h3><div data-hl="d2">'+lo.map(row).join("")+'</div>';
}
function itemDetail(){
 let h='<h2 class="sec">Section 5 &mdash; Item Detail</h2><p class="hint">Full item-level scores by view across all 65 behaviors and all five capacities.</p><div class="ex"><button class="more" type="button" id="exp" style="margin:0">Expand all</button><button class="more" type="button" id="col" style="margin:0">Collapse all</button></div>';
 CAPS.forEach((n,c)=>{
  h+='<h3>'+n+'</h3>';
  clusters.filter(k=>k.c===c).forEach(k=>{
   const open=(c===2)?' open':'';
   h+='<details'+open+' data-hl="e1-'+c+'-'+k.cl.replace(/\W/g,"")+'"><summary>'+esc(k.cl)+'</summary><div class="ov"><table><thead><tr><th>Behavior</th><th class="n">The Full Picture</th>'+bmH()+'<th class="n">My Leader\'s View</th><th class="n">My Team\'s View</th><th class="n">My Stakeholders\' View</th><th class="n">My Own View</th></tr></thead><tbody>';
   k.rows.forEach(r=>{h+='<tr data-hl="r-'+r.id+(r.id===45?' e3':'')+'"><td>'+esc(r.t)+'</td><td class="n"><b>'+f1(fp(r))+'</b></td>'+bmC(fpRaw(r),r.bm)+'<td class="n">'+f1(r.L)+'</td><td class="n">'+f1(r.T)+'</td><td class="n">'+f1(r.S)+'</td><td class="n">'+r.s+'</td></tr>'});
   h+='</tbody></table></div></details>';});});
 return h;
}
const QS=[
 ["When this person is at their best, what does that look like, and what impact does it have on the people around them or the work?",[
  "Jordan is at their best in the room with the team. People feel heard, and the conversation gets honest quickly. That makes it easier for everyone to bring real problems forward.",
  "When a project is stuck, Jordan stays calm and keeps everyone focused on what we can control. The team settles down and starts solving.",
  "Warm, approachable, and genuinely interested in people. New team members feel welcome right away.",
  "Jordan brings a steady presence when things get hard. I have seen it carry the whole team through a difficult quarter.",
  "NA","I do not work with Jordan closely enough to say."],
  "At my best I am listening closely, helping people see what is possible, and keeping the team calm under pressure."],
 ["What one thing, if they made this an area of focused effort, would most accelerate their growth and effectiveness over the next year?",[
  "Setting clear expectations early, and following up when they are missed.",
  "Giving more direct feedback, even when it is uncomfortable. People want to know where they stand.",
  "Handing off more of the work. Jordan sometimes takes on tasks the team could own.",
  "Being clearer about priorities so the team knows what matters most this quarter.",
  "More time spent developing people for their next role.","NA"],

 ["As this person continues to grow in their role, what quality or behavior should they make sure never to lose?",[

  "My care for people and my curiosity."]
];
function comments(){
 let h='<h2 class="sec">Section 6 &mdash; Open-Ended Commentary</h2><p class="hint">Responses are presented exactly as entered and grouped by question. They are not attributed.</p>';
 QS.forEach((q,i)=>{h+='<div class="q" data-hl="f'+(i+1)+'"><h3>'+q[0]+'</h3>'+q[1].map(t=>'<div class="cm"'+((t==="NA"||t.indexOf("I do not work")===0)?' data-hl="fs"':'')+'>'+esc(t)+'</div>').join("")+'<div class="cm me" data-hl="f4"><b>Participant\'s own answer:</b> '+esc(q[2])+'</div></div>'});
 return h;
}
function benchmark(){
 const ex=U.filter(r=>zone(r)==="R"&&ind(fpRaw(r),r.bm)==="B").slice(0,3);
 let h='<h2 class="sec">The Benchmark</h2><h3>Where it appears</h3><div class="ov"><table data-hl="g0"><thead><tr><th>Section</th><th class="n">Shows the benchmark?</th></tr></thead><tbody>';
 [["1 Participant Overview","Yes"],["2 Awareness Zones","No"],["3 Capacity & Cluster Summary","Yes"],["4 Spotlight Items","Yes"],["5 Item Detail","Yes"],["6 Open-Ended Commentary","No"]].forEach(a=>{h+='<tr><td>'+esc(a[0])+'</td><td class="n"><b>'+a[1]+'</b></td></tr>'});
 h+='</tbody></table></div><h3>The three indicators</h3><div class="ov"><table data-hl="g1"><thead><tr><th>Indicator</th><th>When it applies</th></tr></thead><tbody><tr><td>'+IND.A+'</td><td>The Full Picture is more than 0.3 above the benchmark</td></tr><tr><td>'+IND.T+'</td><td>The Full Picture is within 0.3 of the benchmark</td></tr><tr><td>'+IND.B+'</td><td>The Full Picture is more than 0.3 below the benchmark</td></tr></tbody></table></div>';
 h+='<h3>Overall score by capacity, with the benchmark on</h3><div class="ov"><table data-hl="g2"><thead><tr><th>Capacity</th><th class="n">The Full Picture</th><th class="n">Benchmark</th><th class="n">Indicator</th></tr></thead><tbody>';
 CAPS.forEach((n,c)=>{const g=capG[c];h+='<tr><td><b>'+n+'</b></td><td class="n">'+f1(g.fp)+'</td><td class="n">'+f1(g.bm)+'</td><td class="n">'+IND[ind(g.fp,g.bm)]+'</td></tr>'});
 h+='</tbody></table></div><h3>Same behavior, two lenses</h3><p class="hint">Each of these is a Recognized Strength in Section 2, and each sits Below the benchmark.</p><div class="ov"><table data-hl="g3"><thead><tr><th>Behavior</th><th class="n">Zone</th><th class="n">The Full Picture</th><th class="n">Benchmark</th><th class="n">Indicator</th></tr></thead><tbody>';
 ex.forEach(r=>{h+='<tr><td>'+esc(r.t)+'</td><td class="n">Recognized Strength</td><td class="n">'+f1(fp(r))+'</td><td class="n">'+f1(r.bm)+'</td><td class="n">'+IND.B+'</td></tr>'});
 return h+'</tbody></table></div>';
}
// ---------- guide

let step=0;
function goto(n){
 step=Math.max(0,Math.min(STEPS.length-1,n)); const s=STEPS[step];
 if(step===STEPS.length-1&&!BM){BM=true;$("bm").checked=true;}
 $("steps").innerHTML=STEPS.map((x,i)=>'<button type="button" data-s="'+i+'" class="'+(i===step?'on':'')+'" aria-current="'+(i===step)+'">'+x.label+'</button>').join("");
 let g='<h2>'+s.title+'</h2><p>'+s.what+'</p>';
 if(s.how) g+='<p>'+s.how+'</p>';
 if(s.look.length){g+='<p class="lab">Look at</p><ol>'+s.look.map(l=>'<li><button type="button" class="look" data-t="'+l[0]+'">'+l[1]+'</button></li>').join("")+'</ol>';}
 g+='<p><span class="lab">For you as a coach.</span> '+s.coach+'</p><p><span class="lab">Reflect (not scored).</span> '+s.reflect+'</p>';
 $("guide").innerHTML=g;
 renderPage();
 ["back1","back2"].forEach(i=>$(i).disabled=(step===0)); ["next1","next2"].forEach(i=>$(i).disabled=(step===STEPS.length-1));
}
function renderPage(){
 $("page").innerHTML=STEPS[step].render();
 const m=$("moreR"); if(m) m.onclick=()=>{document.querySelectorAll("#page .hid").forEach(e=>e.style.display="block");m.style.display="none"};
 const ex=$("exp"); if(ex){ex.onclick=()=>document.querySelectorAll("#page details").forEach(d=>d.open=true);$("col").onclick=()=>document.querySelectorAll("#page details").forEach(d=>d.open=false)}
}
function hl(t){
 document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
 const els=[...document.querySelectorAll("#page [data-hl]")].filter(e=>e.getAttribute("data-hl").split(" ").includes(t));
 if(!els.length) return;
 // reveal hidden items inside zones or closed details
 els.forEach(e=>{e.classList.add("hl"); const d=e.closest("details"); if(d) d.open=true; });
 els[0].scrollIntoView({behavior:"smooth",block:"center"});
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b) return;
 if(b.dataset.s!==undefined) goto(+b.dataset.s);
 else if(b.dataset.go) goto(+b.dataset.go);
 else if(b.dataset.t) hl(b.dataset.t);
});
["back1","back2"].forEach(i=>$(i).onclick=()=>{goto(step-1);window.scrollTo(0,0)});
["next1","next2"].forEach(i=>$(i).onclick=()=>{goto(step+1);window.scrollTo(0,0)});
$("bm").onchange=e=>{BM=e.target.checked; renderPage();};
goto(0);
</script>
